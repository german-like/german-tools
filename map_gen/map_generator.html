<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="../styles/style.css" rel="stylesheet">
    <link href="./gen_style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Tools - 創作支援ツール</title>
</head>
<body>
  <header>
    German Tools - 創作支援ツール
  </header>
  <div id="side_bar">
    <label>海水面: <input type="range" id="seaLevel" min="0" max="1" step="0.01" value="0.7"></label>
    シード: <input type="number" id="seed" value="12345">

    <label for="colorMode">パレット:</label>
        <select id="colorMode" onchange="run()">
        <option value="hypsometric">アトラス (Atlas)</option>
        <option value="grayscale">グレースケール (Heightmap)</option>
        <option value="landmask">ランドマスク (Land Mask)</option>
    </select>

    <button onclick="run()">現在のシードで生成</button>
    <button onclick="randomize()" style="background-color: #4CAF50; color: white;">🎲</button>
    <button onclick="downloadMap()">ダウンロード</button>
  </div>
  <main>
      <span id="loadingMsg" style="color: #666; margin-left: 10px; display: none;">Wait a minute...</span>
      <canvas id="map" width="1000" height="500"></canvas>
  </main>
  <footer>
    <! --- フッター --->
  </footer>
<script src="map_gen_core.js"></script>
</body>
</html>
