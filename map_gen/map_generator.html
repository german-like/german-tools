<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="../styles/style.css" rel="stylesheet">
    <link href="./gen_style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Tools - 創作支援ツール</title>
</head>
<body>
  <header>
    <a href="../index.html" class="anchor">German Tools - 創作支援ツール</a>
  </header>
  <div id="side_bar">
    <label>海水面: <input type="range" id="seaLevel" class="sealevel" min="0" max="1" step="0.01" value="0.7"></label>
    <br>
      <div class="container">
    　  シード: <input type="number" id="seed" class="input" value="0">
        <button onclick="randomize()" class="run" id="randomize">🎲</button>
    <br>
    <label for="colorMode">パレット:</label>
        <select id="colorMode" onchange="run()">
        <option value="hypsometric">アトラス (Atlas)</option>
        <option value="grayscale">グレースケール (Heightmap)</option>
        <option value="landmask">ランドマスク (Land Mask)</option>
    </select>
    <br>
    <button onclick="run()" class="run">現在のシードで生成</button>
    <br>
    <button onclick="downloadMap()" id="download">ダウンロード</button>
  </div>
  <main>
      <span id="loadingMsg" style="color: #666; margin-left: 10px; display: none;">Wait a minute...</span>
      <canvas id="map" width="1000" height="500"></canvas>
  </main>
  <footer>
    <! --- フッター --->
  </footer>
<script src="map_gen_core.js"></script>
<script src="gen_style.js"></script>
</body>
</html>
